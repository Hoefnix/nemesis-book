<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nemesis - Johannes Smits | Sci-Fi Boek</title>
  <meta name="description" content="She didn't choose this century, this body, or this fight. She's finishing it. Lees Nemesis van Johannes Smits.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #131722;
      --text-main: #e6edf3;
      --text-muted: #8b949e;
      --accent: #ff5e3a;
      --accent-hover: #ff7a59;
      --border: #232a3b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 720px;
      width: 100%;
      text-align: center;
    }

    .badge {
      display: inline-block;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--accent);
      background: rgba(255, 94, 58, 0.1);
      border: 1px solid rgba(255, 94, 58, 0.3);
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      margin-bottom: 1.2rem;
      font-weight: 600;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
      background: linear-gradient(180deg, #ffffff, #8b949e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .author {
      font-size: 1.15rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .tagline {
      font-style: italic;
      color: #c9d1d9;
      font-size: 1.05rem;
      margin-bottom: 2rem;
      padding: 0 1rem;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      margin-bottom: 2.5rem;
      background: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .cta-heading {
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
    }

    .links-grid {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin-bottom: 3rem;
    }

    .book-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      background-color: var(--card-bg);
      color: var(--text-main);
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      border: 1px solid var(--border);
      transition: all 0.2s ease-in-out;
    }

    .book-btn:hover {
      background-color: var(--border);
      border-color: var(--accent);
      transform: translateY(-2px);
      color: #fff;
    }

    .book-btn.primary {
      background: linear-gradient(135deg, var(--accent), #d94826);
      border-color: var(--accent);
      color: #fff;
    }

    .book-btn.primary:hover {
      background: linear-gradient(135deg, var(--accent-hover), var(--accent));
      box-shadow: 0 0 20px rgba(255, 94, 58, 0.4);
    }

    footer {
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="badge">Nu Verkrijgbaar</span>
    <h1>Nemesis</h1>
    <div class="author">door Johannes Smits</div>
    
    <p class="tagline">
      "She didn't choose this century, this body, or this fight. She's finishing it."
    </p>

    <!-- YouTube Boektrailer -->
    <div class="video-wrapper">
      <iframe 
        src="https://www.youtube-nocookie.com/embed/YA22VJr1KWM" 
        title="Nemesis Boektrailer" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>

    <div class="cta-heading">Bestel of lees direct</div>

    <!-- Retailer links -->
    <div class="links-grid">
      <a href="https://www.amazon.com/dp/B0H9HH522P" target="_blank" rel="noopener noreferrer" class="book-btn primary">
        <span>Bestel op Amazon (Kindle / Paperback)</span>
      </a>

      <a href="https://www.kobo.com/nl/nl/ebook/nemesis-383" target="_blank" rel="noopener noreferrer" class="book-btn">
        <span>Lees op Rakuten Kobo</span>
      </a>

      <a href="https://books.apple.com/nl/book/nemesis/id6791311382" target="_blank" rel="noopener noreferrer" class="book-btn">
        <span>Download in Apple Books</span>
      </a>
    </div>

    <footer>
      &copy; Johannes Smits. Alle rechten voorbehouden.
    </footer>
  </div>

</body>
</html>
